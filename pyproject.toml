[project]
name = "tg-auth"
version = "0.1.0"
description = "A helper utility to manage telegram login session in K3s."
readme = "README.md"
authors = [{ name = "SeshuTarapatla", email = "seshu.tarapatla@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "async-typer>=0.1.10",
    "kubernetes>=35.0.0",
    "my-modules",
    "pydantic>=2.12.5",
    "telethon>=1.42.0",
]

[project.scripts]
tg-auth = "tg_auth:tg_auth"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ipykernel>=7.2.0"]

[tool.uv.sources]
# Pinned to match wsl-bridge/Prefect-K3S/Insta-Automate's own pins
# (Insta-Automate-Control-Center DECISIONS.md D71) — uv's resolver treats
# an unpinned git URL and a @rev-pinned one for the same package as
# genuinely conflicting sources, so every repo in this dependency graph
# that references my-modules has to agree on the same pin. TG-Auth wasn't
# previously documented as part of that graph; found live tracing the
# actual conflict, not from CLAUDE.md's repo table.
my-modules = { git = "https://github.com/SeshuTarapatla/my-modules.git", rev = "94b308a" }
